# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.base_url: '%env(APP_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones


    App\EventSubscriber\Doctrine\MigrationEventSubscriber:
        class: App\EventSubscriber\Doctrine\MigrationEventSubscriber
        tags:
            - { name: doctrine.event_subscriber, connection: default }


    App\Service\HomeDataCsvService:
        arguments:
            $baseUrl: '%app.base_url%'
            $resourceDir: '%kernel.project_dir%/resource/storage'

    admin.shop:
        class: App\Admin\ShopAdmin
        arguments: [~, App\Entity\Shop, ~]
        tags:
            - { name: sonata.admin, model_class: App\Entity\Shop, manager_type: orm, label: Магазины, group: Shops }
    admin.address:
        class: App\Admin\AddressAdmin
        arguments: [ ~, App\Entity\Address, ~ ]
        tags:
            - { name: sonata.admin, manager_type: orm, label: Адреса, group: Shops }
    admin.contact:
        class: App\Admin\ContactAdmin
        arguments: [~, App\Entity\Contact, ~]
        tags:
            - { name: sonata.admin, manager_type: orm, label: Контакты, group: Contacts }
    admin.user:
        class: App\Admin\UserAdmin
        arguments: [~, App\Entity\User, ~]
        tags:
            - { name: sonata.admin, model_class: App\Entity\User, manager_type: orm, label: Пользователи, group: Users }
    admin.user_profile:
        class: App\Admin\UserProfileAdmin
        arguments: [~, App\Entity\UserProfile, ~]
        tags:
            - { name: sonata.admin, model_class: App\Entity\UserProfile, manager_type: orm, label: Профили пользователей, show_in_dashboard: false, parent: App\Entity\User }
